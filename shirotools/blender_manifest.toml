schema_version = "1.0.0"

id = "shirotools"
version = "1.0.0"
name = "ShiroTools"
tagline = "Timeline, baking, textures, weights and Unity export toolbag"
maintainer = "bmilan"
type = "add-on"

tags = ["Animation", "Rigging", "Bake", "Import-Export", "Mesh", "Render"]

